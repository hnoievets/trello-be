name: CI.yml

# виконується при таких подіях:
on:
  # запит на додавання змін у гілку main
  pull_request:
    branches: [ main ]

# перелік робіт
jobs:
  # назва роботи
  build:
    # Використовується хмарне середовище GitHub з останнім образом Ubuntu
    runs-on: ubuntu-latest
    steps:
      # Клонування репозиторію у середовище
      - uses: actions/checkout@v5

      # Встановлення Node.js
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # Кешування
      - name: Cache NPM cache files
        uses: actions/cache@v4
        with:
          # Шлях до цільової папки
          path: ~/.npm
          # Назва кешу
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          # Ключ відновлення
          restore-keys: ${{ runner.os }}-npm-

      # Встановлення залежностей
      - name: Install dependencies
        run: npm ci

      # Перевірка стилю коду
      - name: Code linting
        run: npm run lint

  test:
    # Використовується хмарне середовище GitHub з останнім образом Ubuntu
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      # не зупиняти матрицю якщо один з елементів провалився
      fail-fast: true
      # об'явлення шардів
      matrix:
        shard: [ 1, 2 ]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 'password'
          MYSQL_DATABASE: 'trello'
        ports:
          - 3306:3306
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      SWAGGER_BACKEND_URL: 'http://localhost:3000'
      SWAGGER_TITLE: 'Trello'
      FALLBACK_LANGUAGE: 'en'
      DB_DIALECT: 'mysql'
      DB_HOST: 'localhost'
      DB_PORT: '3306'
      DB_USER: 'root'
      DB_PASSWORD: 'password'
      DB_NAME: 'trello'
      JWT_SECRET: 'secret'
      JWT_EXPIRES_IN: 43200000
      REDIS_HOST: 'localhost'
      REDIS_PORT: 6379
      REDIS_DB: ''
      REDIS_PASSWORD: ''
      REDIS_PREFIX: 'prefix_'
      CORS_ORIGINS: '["http://localhost:5173"]'
      FRONTEND_URL: 'http://localhost:5173'
      AWS_SES_REGION: 'us-east-1'
      AWS_SES_ACCESS_KEY: ${{secrets.AWS_SES_ACCESS_KEY}}
      AWS_SES_KEY_SECRET: ${{secrets.AWS_SES_KEY_SECRET}}
      AWS_SES_FROM_MAIL: 'oleh.hnoievets@cleveroad.com'
      AWS_S3_REGION: 'eu-central-1'
      AWS_S3_KEY_SECRET: ${{secrets.AWS_S3_KEY_SECRET}}
      AWS_S3_ACCESS_KEY: ${{secrets.AWS_S3_ACCESS_KEY}}
      AWS_S3_URL_EXPIRES_IN_SEC: 1800
      AWS_S3_BUCKET_NAME: 'trello-bucket-frankfurt'

    steps:
      # Клонування репозиторію у середовище
      - uses: actions/checkout@v5
      # Встановлення Node.js
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # Кешування
      - name: Cache NPM cache files
        uses: actions/cache@v4
        with:
          # Шлях до цільової папки
          path: ~/.npm
          # Назва кешу
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          # Ключ відновлення
          restore-keys: ${{ runner.os }}-npm-

      # Встановлення залежностей
      - name: Install dependencies
        run: npm ci

      - name: DB migrations
        run: npm run migrate

      # Запуск тестів по шардах з паралелізаціє на 4 воркери
      - name: Run tests shards
        run: npm run test:e2e --shard=${{matrix.shard}}/2 --maxWorkers=4 --slient

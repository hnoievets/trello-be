# назва конвеєру
name: base CI

# виконується при таких подіях:
on:
  # додавання змін у гілку main
  push:
    branches: [ main ]
  # запит на додавання змін у гілку main
  pull_request:
    branches: [ main ]

# перелік робіт
jobs:
  # назва роботи
  build:
    # Використовується хмарне середовище GitHub з останнім образом Ubuntu
    runs-on: ubuntu-latest
    steps:
      # Крок 1: Клонування репозиторію у середовище
      - uses: actions/checkout@v5

      # Крок 2: будування Docker-образу
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          # Контекст збірки – поточна директорія
          context: .
          # Образ не завантажується у реєстр
          push: false
          # Тег для образу
          tags: trello-be:latest
